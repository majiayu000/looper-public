---
platforms:
  test_platform:
    enabled: true
    cli: echo
    db: testdata/test.db
    metrics:
      candidate_backlog_table: test_candidate_backlog
      candidate_backlog_status_field: status
      candidate_backlog_pending_value: pending
      action_table: test_actions
      action_type_field: action_type
      action_time_field: acted_at

engines:
  claude:
    kind: claude
    cli: claude
    skills_dir: /tmp/claude-skills
  codex:
    kind: codex
    cli: codex
    skills_dir: /tmp/codex-skills
    default_sandbox: read-only
    default_reasoning_effort: low
    skip_git_repo_check: true

scheduling:
  jobs:
    - name: test_scan
      schedule: "@every 1m"
      command: "echo scan"
      workdir: .
      type: script

    - name: test_skill
      schedule: "@every 5m"
      workdir: .
      type: skill
      engine: claude
      skill: test-skill
      allowed_tools: [Bash, Read]

learning:
  enabled: false
  guardrails:
    max_weight: 3.0
    min_weight: 0.3
    max_daily_change: 0.2
    min_samples: 5
---
